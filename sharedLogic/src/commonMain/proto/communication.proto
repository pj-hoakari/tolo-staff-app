syntax = "proto3";
package tolo.staff.v1;
option java_multiple_files = true;
option java_package = "dev.usbharu.tolo.communication.v1";
option java_outer_classname = "CommunicationProto";

import "google/protobuf/timestamp.proto";
import "common.proto";

enum ThreadKind {
  THREAD_KIND_UNSPECIFIED = 0;
  THREAD_KIND_GENERAL = 1;
  THREAD_KIND_LOCATION = 2;
  THREAD_KIND_DIRECT = 3;
}
enum ThreadStatus {
  THREAD_STATUS_UNSPECIFIED = 0;
  THREAD_STATUS_OPEN = 1;
  THREAD_STATUS_CLOSED = 2;
  THREAD_STATUS_ARCHIVED = 3;
}
enum MessageAudience {
  MESSAGE_AUDIENCE_UNSPECIFIED = 0;
  MESSAGE_AUDIENCE_STAFF = 1;
  MESSAGE_AUDIENCE_GUEST = 2;
}
message ConversationThread {
  ThreadId id = 1;
  EventScope scope = 2;
  reserved 3;
  reserved "tenant_id", "event_id";
  string title = 4; // Trimmed, 1..120 characters.
  ThreadKind kind = 5;
  optional PointId point_id = 6; // Required only for LOCATION.
  repeated StaffId participant_staff_ids = 7; // Set semantics; no duplicates.
  StaffId created_by_staff_id = 8;
  ThreadStatus status = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  int64 version = 12;
}
message Message {
  MessageId id = 1;
  EventScope scope = 2;
  reserved 3;
  reserved "tenant_id", "event_id";
  ThreadId thread_id = 4;
  StaffId sender_staff_id = 5;
  MessageAudience audience = 6;
  string body = 7; // Trimmed, 1..4000 characters; invalid controls forbidden.
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp edited_at = 9;
  optional google.protobuf.Timestamp deleted_at = 10;
  int64 version = 11;
}
message ListThreadsRequest {
  EventScope scope = 1;
  repeated ThreadStatus statuses = 2;
  repeated ThreadKind kinds = 3;
  optional StaffId participant_staff_id = 4;
  optional PointId point_id = 5;
  PageRequest page = 6;
}
message ListThreadsResponse { repeated ConversationThread threads = 1; PageInfo page = 2; }
message GetThreadRequest { EventScope scope = 1; ThreadId thread_id = 2; }
message CreateThreadRequest {
  EventScope scope = 1;
  string request_id = 2;
  string title = 3;
  ThreadKind kind = 4;
  optional PointId point_id = 5;
  repeated StaffId participant_staff_ids = 6;
}
message UpdateThreadRequest {
  EventScope scope = 1;
  ThreadId thread_id = 2;
  int64 expected_version = 3;
  string title = 4;
  repeated StaffId participant_staff_ids = 5;
}
message CloseThreadRequest { EventScope scope = 1; ThreadId thread_id = 2; int64 expected_version = 3; }
message ReopenThreadRequest { EventScope scope = 1; ThreadId thread_id = 2; int64 expected_version = 3; }
message ArchiveThreadRequest { EventScope scope = 1; ThreadId thread_id = 2; int64 expected_version = 3; }
message ListMessagesRequest {
  EventScope scope = 1;
  ThreadId thread_id = 2;
  optional StaffId sender_staff_id = 3;
  repeated MessageAudience audiences = 4;
  PageRequest page = 5;
}
message ListMessagesResponse { repeated Message messages = 1; PageInfo page = 2; }
message GetMessageRequest { EventScope scope = 1; MessageId message_id = 2; }
message SendMessageRequest {
  EventScope scope = 1;
  string request_id = 2;
  ThreadId thread_id = 3;
  MessageAudience audience = 4;
  string body = 5;
}
message EditMessageRequest { EventScope scope = 1; MessageId message_id = 2; int64 expected_version = 3; string body = 4; }
message DeleteMessageRequest { EventScope scope = 1; MessageId message_id = 2; int64 expected_version = 3; }

service ThreadService {
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  rpc GetThread(GetThreadRequest) returns (ConversationThread);
  rpc CreateThread(CreateThreadRequest) returns (ConversationThread);
  rpc UpdateThread(UpdateThreadRequest) returns (ConversationThread);
  rpc CloseThread(CloseThreadRequest) returns (ConversationThread);
  rpc ReopenThread(ReopenThreadRequest) returns (ConversationThread);
  rpc ArchiveThread(ArchiveThreadRequest) returns (ConversationThread);
}
service MessageService {
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc GetMessage(GetMessageRequest) returns (Message);
  rpc SendMessage(SendMessageRequest) returns (Message);
  rpc EditMessage(EditMessageRequest) returns (Message);
  rpc DeleteMessage(DeleteMessageRequest) returns (Message);
}
